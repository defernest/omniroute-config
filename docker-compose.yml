services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:20130:20130"
      - "127.0.0.1:20131:20131"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    mem_limit: 100m
    networks:
      - internal_network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Profile: cli (Official image with CLI integration support)
  omniroute-cli:
    image: diegosouzapw/omniroute:${OMNIROUTE_TAG:-latest}
    container_name: omniroute-prod
    restart: unless-stopped
    profiles:
      - cli
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    expose:
      - "20128"
      - "20129"
    networks:
      - internal_network
    volumes:
      - omniroute-prod-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Profile: web (Built from official OmniRoute repo runner-web stage for Chromium/Playwright)
  omniroute-web:
    build:
      context: https://github.com/diegosouzapw/OmniRoute.git#main
      target: runner-web
    image: omniroute:web
    container_name: omniroute-prod
    restart: unless-stopped
    profiles:
      - web
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    expose:
      - "20128"
      - "20129"
    networks:
      - internal_network
    volumes:
      - omniroute-prod-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Profile: base (Lean official image without extra CLIs or Chromium)
  omniroute-base:
    image: diegosouzapw/omniroute:${OMNIROUTE_TAG:-latest}
    container_name: omniroute-prod
    restart: unless-stopped
    profiles:
      - base
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    expose:
      - "20128"
      - "20129"
    networks:
      - internal_network
    volumes:
      - omniroute-prod-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal_network:
    driver: bridge

volumes:
  omniroute-prod-data:
  redis-data:
